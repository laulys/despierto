name: Build macOS app

on:
  push:
    branches: ["feat/multi-agent-lid-brightness-remote", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Despierto.app
        run: |
          set -euo pipefail
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent build/Despierto.app build/Despierto.zip
          ls -lh build/Despierto.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Despierto
          path: build/Despierto.zip
          if-no-files-found: error
